# PLACEHOLDER ONLY. It documents the shape of the Secret; it is NOT listed in any
# kustomization.yaml on purpose, because applying it would overwrite the real Secret.
#
# Create the real one from the command line, never from a file:
#   export LLM_API_KEY=...        # only needed for LLM_PROVIDER=hosted
#   make secret
# which runs:
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
#
# Base64 is encoding, not encryption: never commit a real value (handout 4.7).
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
