# Weekly re-index; same image and args as the Job. Manual run:
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
spec:
  schedule: 0 3 * * 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: indexer
            app.kubernetes.io/part-of: rahbar
        spec:
          restartPolicy: OnFailure
          serviceAccountName: rahbar-indexer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: indexer
            image: rahbar-indexer:base
            imagePullPolicy: IfNotPresent
            args:
            - python
            - -m
            - pipeline.run
            envFrom:
            - configMapRef:
                name: rahbar-config
            env:
            - name: CORPUS_DIR
              value: /corpus
            - name: CORPUS_WAIT_SECONDS
              value: '600'
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: '1'
                memory: 1536Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: corpus
            persistentVolumeClaim:
              claimName: corpus-data
              readOnly: true
          - name: tmp
            emptyDir: {}
