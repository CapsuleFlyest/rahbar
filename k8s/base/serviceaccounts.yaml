# One ServiceAccount per workload (handout 4.7, "everything is admin").
# None of these pods ever talks to the Kubernetes API server, so the token is not
# mounted at all: a compromised container has no credential to steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-api
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-ui
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-chroma
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-redis
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-indexer
  namespace: rahbar
automountServiceAccountToken: false
