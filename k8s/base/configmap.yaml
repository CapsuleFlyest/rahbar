# The single source of configuration for the api AND the indexer (handout 4.1, 4.4).
# EMBED_MODEL lives here once: the indexer pins the index to it, the api checks the index
# against it. Changing a value here does not restart pods by itself:
#   kubectl rollout restart deployment/api -n rahbar
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  # --- which implementations to load -------------------------------------------------
  RETRIEVER: "chroma"              # stub | chroma
  LLM_PROVIDER: "hosted"           # stub | ollama-host | ollama-incluster | hosted (Groq, see ADR 0004)
  READY_CHECKS: "on"               # /readyz really checks Chroma, Redis and the pin

  # --- the embedding pin (section 4.4): shared by api and indexer ---------------------
  EMBED_MODEL: "nomic-embed-text"

  # --- generation ---------------------------------------------------------------------
  # Generation: Groq free tier (OpenAI-compatible). The KEY is in the Secret, never here.
  LLM_MODEL: "llama-3.1-8b-instant"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"
  # Embeddings: Groq has no embedding model, so the pinned EMBED_MODEL is served by a small
  # Ollama (nomic-embed-text) on the host. Used by the api (queries) and the indexer (chunks).
  OLLAMA_URL: "http://host.minikube.internal:11434"
  # Facts and JSON want 0 to 0.3. 0.2 keeps the wording stable without being brittle.
  # Temperature 0 does not fix hallucination: absent knowledge stays absent.
  TEMPERATURE: "0.2"
  LLM_TIMEOUT_SECONDS: "60"

  # --- retrieval ----------------------------------------------------------------------
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  TOP_K: "5"
  # Cosine similarity below this counts as "nothing relevant": the api abstains.
  # 0.50 is a starting point; tune it with the golden set (handout 3.3).
  RELEVANCE_FLOOR: "0.50"

  # --- semantic cache -----------------------------------------------------------------
  CACHE_ENABLED: "true"
  CACHE_THRESHOLD: "0.92"
  CACHE_TTL_SECONDS: "86400"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # --- indexer ------------------------------------------------------------------------
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  CHUNK_STRATEGY: "structure"      # structure | fixed (fixed is for the failure analysis)

  LOG_LEVEL: "INFO"
