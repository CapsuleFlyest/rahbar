name: cd
on:
  push: {branches: [main]}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: cd api && pytest -q --cov=app --cov-fail-under=60
      - run: cd indexer && pytest -q
  build-push:
    needs: test        # publish only code that passed its tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # an access token, never the password
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: api, push: true, tags: "${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}"}
      - uses: docker/build-push-action@v6
        with: {context: indexer, push: true, tags: "${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}"}
      - uses: docker/build-push-action@v6
        with: {context: ui, push: true, tags: "${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}"}
  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: helm/kind-action@v1.10.0
        with: {cluster_name: kind}
      - name: ingress-nginx for kind
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/baremetal/deploy.yaml
          kubectl -n ingress-nginx rollout status deploy/ingress-nginx-controller --timeout=180s
      - run: scripts/ci/prepare-ollama.sh
      - run: scripts/ci/set-ollama-host.sh k8s/overlays/ci
      - name: deploy by commit SHA (never :latest)
        working-directory: k8s/overlays/ci
        run: |
          U=${{ secrets.DOCKERHUB_USERNAME }}
          for c in api indexer ui; do
            sed -i "s#{name: rahbar-$c, newTag: ci}#{name: rahbar-$c, newName: docker.io/$U/rahbar-$c, newTag: ${{ github.sha }}}#" kustomization.yaml
          done
          kubectl apply -k .
      - run: kubectl -n rahbar rollout status statefulset/chroma --timeout=180s
      - run: scripts/load-corpus.sh eval/fixtures
      - run: kubectl -n rahbar wait --for=condition=complete job/indexer --timeout=600s
      - run: kubectl -n rahbar rollout status deployment/api --timeout=300s
      - name: smoke test through the Ingress
        run: |
          kubectl -n rahbar get endpoints api
          kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 8080:80 &
          sleep 3
          curl -sf -H "Host: rahbar.local" http://localhost:8080/ >/dev/null
          curl -sf -H "Host: rahbar.local" -H 'Content-Type: application/json' \
            -d '{"question":"What is the minimum attendance to sit the final exam?"}' \
            http://localhost:8080/api/ask
